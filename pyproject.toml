[project]
name = "mac-sony-obs-recording-automation"
version = "1.0.0"
description = "Mac automation app that records video with OBS Studio + a Sony camera, MacBook camera, microphone, and screen capture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Connor O'Dea" }
]
dependencies = [
    "obsws-python>=1.6.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
menubar = [
    "rumps>=0.4.0",
]
app = [
    "rumps>=0.4.0",
    "py2app>=0.28.0",
]

[project.scripts]
recording-auto = "recording_automation.cli:app"
sonyobs = "recording_automation.cli:app"
sob = "recording_automation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recording_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
